version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
  exclusions:
    rules:
      # Allow controlled exec.CommandContext calls inside the opengrep and sandbox wrappers
      - path: internal/(opengrep|sandbox)/
        linters:
          - gosec
        text: "G204"

formatters:
  enable:
    - gofmt
    - goimports
